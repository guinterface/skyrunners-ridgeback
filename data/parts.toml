[[part]]
id = "thermal_cam"
name = "Thermal camera: FLIR Lepton 3.5 on a PureThermal 3 board"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 291.99
mass = 25
size = "Lepton 11.8 × 12.7 × 7.2 mm on a 32 × 32 mm board, in a 40 × 30 × 22 mm printed case"
power_w = 1
box = { c = [60, -35, -126], dims = [40, 30, 22] }
buy = [
  { store = "GroupGets: Lepton 3.5", link = "https://groupgets.com/products/flir-lepton-3-5", price = "$172.00" },
  { store = "GroupGets: PureThermal 3 board", link = "https://groupgets.com/products/purethermal-3", price = "$119.99" },
]
job = "Measures the temperature of the shrub canopy, looking straight down."
why = "When chaparral shrubs run short of water they close their leaf pores and the leaves warm up compared with the air; leaf-minus-air temperature is a standard plant water-stress signal, and the one sensor here that works in the pre-dawn flight too. 160 × 120 pixels, radiometric. At 60 m one pixel covers about 0.4 m; with lens blur and motion, only shrubs of about 2 m or more give pure canopy pixels, smaller ones mix with soil. Its accuracy (about ±5 °C) is not enough alone, so warm and cool targets of known temperature sit in every flight, and the camera is kept in an insulated case and warmed up in a hover before the survey."
without = "No measure of plant stress: leaf temperature against air temperature is the only stress signal the drone has. The papers below are on irrigated crops and orchards, not chaparral; how well it works over shrubs is part of what the first flights test."
refs = [
  { cite = "Jackson et al., Water Resources Research 17:1133 (1981)", link = "https://doi.org/10.1029/WR017i004p01133", says = "canopy temperature as a water stress indicator (the crop water stress index)" },
  { cite = "Berni et al., IEEE Trans. Geoscience and Remote Sensing 47:722 (2009)", link = "https://doi.org/10.1109/TGRS.2008.2010457", says = "a small drone with an inexpensive thermal camera (40 cm pixels) mapped water stress from canopy temperature, checked on the ground" },
  { cite = "Gonzalez-Dugo et al., Precision Agriculture 14:660 (2013)", link = "https://doi.org/10.1007/s11119-013-9322-9", says = "drone thermal images used to map the water status of five tree species in one orchard" },
  { cite = "Aragon et al., Sensors 20:3316 (2020)", link = "https://doi.org/10.3390/s20113316", says = "calibrating a FLIR A655sc pixel by pixel against a lab black body cut its error from about 6 °C to under 1 °C; not tested on a Lepton" },
]
instead = "FLIR Boson 320 or a Workswell WIRIS (thousands of dollars, asked by email): sharper images, but the same need for ground targets to be accurate."
source = "Jackson et al. 1981 (crop water stress index); FLIR Lepton 3.5 datasheet; BEST_PRICES 10 Nov"
connects = [["payload_computer", "USB"]]
nodes = ["thermal_cam"]

[[part]]
id = "rgb_cam"
name = "Colour camera: Raspberry Pi Global Shutter Camera, 6 mm lens (lens not priced)"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 80
mass = 60
size = "38 × 38 × 28 mm body (Raspberry Pi drawing), C/CS lens on top"
power_w = 1
box = { c = [60, 30, -124], dims = [38, 38, 28] }
buy = [
  { store = "PiShop.us (camera $55, out of stock 18 Nov; lens about $25 not priced)", link = "https://www.pishop.us/product/raspberry-pi-global-shutter-camera/", price = "$55.00 + lens" },
]
job = "Photographs the plot so we can find every shrub, see how much is plant and how much is bare soil, and build its 3D shape from overlapping photos."
why = "1456 × 1088 pixels of 3.45 µm. With a 6 mm lens at 60 m one pixel is 3.5 cm and a photo covers 50 × 38 m; flown with the short side along the track, 2 photos a second give 75 % overlap at 19 m/s, enough to build the canopy's 3D shape (photogrammetry). A global shutter takes the whole frame at once, so the picture does not skew at speed; 1 ms exposure smears 1.9 cm, under one pixel. Needs daylight, so it is not used in the pre-dawn flight."
without = "We could not find the same shrub at dawn and at midday, or tell leaf from soil. At midday bare soil is far hotter than leaves, so a thermal pixel that mixes in soil looks like a stressed shrub."
refs = [
  { cite = "Dandois and Ellis, Remote Sensing of Environment 136:259 (2013)", link = "https://doi.org/10.1016/j.rse.2013.04.005", says = "3D canopy structure from overlapping photos taken with an ordinary camera on a hobby drone below 130 m" },
]
instead = "Livox Mid-360 lidar (265 g, 6.5 W): it looks sideways and up, and reaches only 40 m, so it cannot map the ground from 60 m. MAPIR Survey3W ($400) adds a near-infrared band."
source = "Raspberry Pi camera specs; Livox Mid-360 specs (read 18 Nov); our ground-resolution arithmetic"
connects = [["payload_computer", "camera ribbon (CSI)"]]
nodes = ["rgb_cam"]

[[part]]
id = "spot_sensor"
name = "1610 nm spot sensor (built by us): two InGaAs photodiodes behind 1610 nm filters"
system = "payload"
tier = "minimum"
qty = 1
status = "build"
price = 409.71
mass = 80
size = "50 × 40 × 45 mm printed head with a 20° view tube"
power_w = 0.1
box = { c = [125, 0, -125], dims = [50, 40, 45] }
buy = [
  { store = "SyronOptics BP1610-60 filter, 12.5 mm (×2)", link = "https://syronoptics.com/products/bp1610-60", price = "$165.00 each" },
  { store = "DigiKey Marktech MTPD1346D-100 photodiode (×2)", link = "https://www.digikey.com/en/products/detail/marktech-optoelectronics/MTPD1346D-100/5866635", price = "$17.63 each" },
  { store = "Adafruit ADS1115 16-bit converter", link = "https://www.adafruit.com/product/1085", price = "$14.95" },
  { store = "Microchip MCP6V32 op-amp (×2)", link = "https://www.microchipdirect.com/product/MCP6V32", price = "$2.25 each" },
]
job = "Measures how much 1610 nm short-wave infrared light the shrubs reflect, one reading per spot, plus the sunlight coming down."
why = "Water in leaves absorbs strongly near 1600 nm, so reflectance in this band drops as leaves hold less water; it is the standard leaf-water band. A camera for this band costs $5,650 or more (LUCID Triton SWIR) or rents for $2,250 a week, so for the first flights we build a two-channel sensor: one diode looks down through a 20° tube (a 21 m spot at 60 m), one looks up through a diffuser to read the sunlight. Parts $385 plus about $25 of small parts. It needs sunlight, so it works from the morning flight on, not before dawn. Readings taken while the drone banks in a turn are dropped, using the bank angle from the flight controller, because the upward diode then sees the sky at an angle. Each spot mixes shrub, soil and shadow, which is why the near-infrared channel below is worth adding."
without = "We would see stress (leaf pores closing) but have no reading tied to how much water the leaves hold. The band responds to water per leaf area; live fuel moisture, which fire planners use, is water per dry mass, so the two are related, not the same. Open risk: the change between dawn and midday may be too small for this band to see; the first flights test that."
refs = [
  { cite = "Hunt and Rock, Remote Sensing of Environment 30:43 (1989)", link = "https://doi.org/10.1016/0034-4257(89)90046-1", says = "changes in leaf water content detected with near- and middle-infrared reflectance" },
  { cite = "Ceccato et al., Remote Sensing of Environment 77:22 (2001)", link = "https://doi.org/10.1016/S0034-4257(01)00191-2", says = "detecting leaf water content from reflectance in the optical bands" },
  { cite = "Yebra et al., Remote Sensing of Environment 136:455 (2013)", link = "https://doi.org/10.1016/j.rse.2013.05.029", says = "review of remote sensing of live fuel moisture for fire danger" },
]
instead = "A SWIR camera through the companies we emailed (LUCID, Tech Imaging rental, SILIOS, Spectral Devices): images instead of spots, $2,250 a week to $30,000."
source = "Hunt and Rock 1989, Ceccato et al. 2001 (leaf water in the short-wave infrared); SPOT_SENSOR_CIRCUIT doc; prices BEST_PRICES 10 Nov"
connects = [["payload_computer", "I2C"]]
nodes = ["spot_sensor"]

[[part]]
id = "air_sensor"
name = "Air temperature and humidity: Sensirion SHT45"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 12.5
mass = 5
size = "25 × 18 mm board in a small printed sun shield"
power_w = 0
box = { c = [-40, 0, -150], dims = [25, 18, 12] }
buy = [
  { store = "Adafruit SHT45 (STEMMA QT)", link = "https://www.adafruit.com/product/5665", price = "$12.50" },
]
job = "Measures the air temperature and humidity at the drone, every flight."
why = "Leaf temperature only means stress when compared with the air around it and how dry that air is (vapour pressure deficit). The weather meter on the ground is the main reference at canopy height; this sensor adds the air at flight height, which at dawn can differ by several degrees because of the morning temperature inversion. ±0.1 °C and ±1 % humidity; checked against the ground meter in the shade before each flight, and mounted in a small shield away from the electronics."
without = "The weather meter on the ground still gives the air near the canopy, so stress can still be read. What is lost is the air at flight height, which at dawn can be several degrees different because of the morning temperature inversion."
refs = [
  { cite = "Idso et al., Agricultural Meteorology 24:45 (1981)", link = "https://doi.org/10.1016/0002-1571(81)90032-7", says = "leaf-minus-air temperature has to be normalised for the weather, mainly how dry the air is, before it means stress" },
]
instead = "Ground weather meter only: it is the main reference anyway, but misses the air the drone flies through."
source = "Adafruit SHT45 page (read 18 Nov); Idso et al. 1981"
connects = [["payload_computer", "I2C"]]
nodes = ["air_sensor"]

[[part]]
id = "nir_channel"
name = "Near-infrared reference channel (850 nm) for the spot sensor"
system = "payload"
tier = "add"
qty = 1
status = "build"
price = 214
mass = 10
size = "two silicon photodiodes and filters in the spot sensor head"
power_w = 0
box = { c = [125, 28, -125], dims = [20, 16, 30] }
buy = [
  { store = "Edmund Optics 850 nm / 40 nm bandpass, 12.5 mm mounted (×2)", link = "https://www.edmundoptics.com/p/850nm-cwl-40nm-fwhm-125mm-mounted-diameter/22453/", price = "$105.00 each (search listing, 18 Nov)" },
]
job = "Adds a near-infrared band next to the 1610 nm band, down and up, in the same head."
why = "Leaves reflect strongly at 850 nm and water barely absorbs there, so the ratio of the 1610 nm and 850 nm readings cancels most of the effect of lighting and shadow. Soil still mixes in; the colour camera's plant and soil split corrects for that. Pairing a water band with a near-infrared band is the usual leaf-water index. Two filters (most of the $214) and two silicon photodiodes on the same converter."
without = "The 1610 nm reading would also change with lighting, shadow and how much of the 21 m spot is soil, not only with leaf water."
refs = [
  { cite = "Hunt and Rock, Remote Sensing of Environment 30:43 (1989)", link = "https://doi.org/10.1016/0034-4257(89)90046-1", says = "changes in leaf water content detected with near- and middle-infrared reflectance" },
  { cite = "Gao, Remote Sensing of Environment 58:257 (1996)", link = "https://doi.org/10.1016/S0034-4257(96)00067-3", says = "a water index from two near-infrared bands (860 and 1240 nm), one absorbed by water and one not" },
]
instead = "1240 nm band (InGaAs, $123 filter): a second water band, but more expensive."
source = "Hunt and Rock 1989; Ceccato et al. 2001; Edmund Optics listing"
connects = [["spot_sensor", "same head and converter"]]
nodes = ["nir_channel"]

