[[part]]
id = "nir_channel"
name = "Near-infrared reference channel (850 nm) for the spot sensor"
system = "payload"
tier = "add"
qty = 1
status = "build"
price = 214
mass = 10
size = "two silicon photodiodes and filters in the spot sensor head"
power_w = 0
box = { c = [125, 28, -125], dims = [20, 16, 30] }
buy = [
  { store = "Edmund Optics 850 nm / 40 nm bandpass, 12.5 mm mounted (×2)", link = "https://www.edmundoptics.com/p/850nm-cwl-40nm-fwhm-125mm-mounted-diameter/22453/", price = "$105.00 each (search listing, 18 Nov)" },
]
job = "Adds a near-infrared band next to the 1610 nm band, down and up, in the same head."
why = "Leaves reflect strongly at 850 nm and water barely absorbs there, so the ratio of the 1610 nm and 850 nm readings cancels most of the effect of lighting and shadow. Soil still mixes in; the colour camera's plant and soil split corrects for that. Pairing a water band with a near-infrared band is the usual leaf-water index. Two filters (most of the $214) and two silicon photodiodes on the same converter."
without = "The 1610 nm reading would also change with lighting, shadow and how much of the 21 m spot is soil, not only with leaf water."
refs = [
  { cite = "Hunt and Rock, Remote Sensing of Environment 30:43 (1989)", link = "https://doi.org/10.1016/0034-4257(89)90046-1", says = "changes in leaf water content detected with near- and middle-infrared reflectance" },
  { cite = "Gao, Remote Sensing of Environment 58:257 (1996)", link = "https://doi.org/10.1016/S0034-4257(96)00067-3", says = "a water index from two near-infrared bands (860 and 1240 nm), one absorbed by water and one not" },
]
instead = "1240 nm band (InGaAs, $123 filter): a second water band, but more expensive."
source = "Hunt and Rock 1989; Ceccato et al. 2001; Edmund Optics listing"
