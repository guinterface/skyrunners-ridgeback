[[part]]
id = "thermal_cam"
name = "Thermal camera: FLIR Lepton 3.5 on a PureThermal 3 board"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 291.99
mass = 25
size = "Lepton 11.8 × 12.7 × 7.2 mm on a 32 × 32 mm board, in a 40 × 30 × 22 mm printed case"
power_w = 1
box = { c = [65, -35, -126], dims = [40, 30, 22] }
buy = [
  { store = "GroupGets: Lepton 3.5", link = "https://groupgets.com/products/flir-lepton-3-5", price = "$172.00" },
  { store = "GroupGets: PureThermal 3 board", link = "https://groupgets.com/products/purethermal-3", price = "$119.99" },
]
job = "Measures the temperature of the shrub canopy, looking straight down."
why = "When chaparral shrubs run short of water they close their leaf pores and the leaves warm up compared with the air; leaf-minus-air temperature is a standard plant water-stress signal, and the one sensor here that works in the pre-dawn flight too. 160 × 120 pixels, radiometric. At 60 m one pixel covers about 0.4 m; with lens blur and motion, only shrubs of about 2 m or more give pure canopy pixels, smaller ones mix with soil. Its accuracy (about ±5 °C) is not enough alone, so warm and cool targets of known temperature sit in every flight, and the camera is kept in an insulated case and warmed up in a hover before the survey."
without = "No measure of plant stress: leaf temperature against air temperature is the only stress signal the drone has. The papers below are on irrigated crops and orchards, not chaparral; how well it works over shrubs is part of what the first flights test."
refs = [
  { cite = "Jackson et al., Water Resources Research 17:1133 (1981)", link = "https://doi.org/10.1029/WR017i004p01133", says = "canopy temperature as a water stress indicator (the crop water stress index)" },
  { cite = "Berni et al., IEEE Trans. Geoscience and Remote Sensing 47:722 (2009)", link = "https://doi.org/10.1109/TGRS.2008.2010457", says = "a small drone with an inexpensive thermal camera (40 cm pixels) mapped water stress from canopy temperature, checked on the ground" },
  { cite = "Gonzalez-Dugo et al., Precision Agriculture 14:660 (2013)", link = "https://doi.org/10.1007/s11119-013-9322-9", says = "drone thermal images used to map the water status of five tree species in one orchard" },
  { cite = "Aragon et al., Sensors 20:3316 (2020)", link = "https://doi.org/10.3390/s20113316", says = "calibrating a FLIR A655sc pixel by pixel against a lab black body cut its error from about 6 °C to under 1 °C; not tested on a Lepton" },
]
instead = "FLIR Boson 320 or a Workswell WIRIS (thousands of dollars, asked by email): sharper images, but the same need for ground targets to be accurate."
source = "Jackson et al. 1981 (crop water stress index); FLIR Lepton 3.5 datasheet; BEST_PRICES 10 Nov"
connects = [["payload_computer", "USB"]]
nodes = ["thermal_cam"]

[[part]]
id = "rgb_cam"
name = "Colour camera: Raspberry Pi Global Shutter Camera, 6 mm lens (lens not priced)"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 80
mass = 60
size = "38 × 38 × 28 mm body (Raspberry Pi drawing), C/CS lens on top"
power_w = 1
box = { c = [65, 30, -124], dims = [38, 38, 28] }
buy = [
  { store = "PiShop.us (camera $55, out of stock 18 Nov; lens about $25 not priced)", link = "https://www.pishop.us/product/raspberry-pi-global-shutter-camera/", price = "$55.00 + lens" },
]
job = "Photographs the plot so we can find every shrub, see how much is plant and how much is bare soil, and build its 3D shape from overlapping photos."
why = "1456 × 1088 pixels of 3.45 µm. With a 6 mm lens at 60 m one pixel is 3.5 cm and a photo covers 50 × 38 m; flown with the short side along the track, 2 photos a second give 75 % overlap at 19 m/s, enough to build the canopy's 3D shape (photogrammetry). A global shutter takes the whole frame at once, so the picture does not skew at speed; 1 ms exposure smears 1.9 cm, under one pixel. Needs daylight, so it is not used in the pre-dawn flight."
without = "We could not find the same shrub at dawn and at midday, or tell leaf from soil. At midday bare soil is far hotter than leaves, so a thermal pixel that mixes in soil looks like a stressed shrub."
refs = [
  { cite = "Dandois and Ellis, Remote Sensing of Environment 136:259 (2013)", link = "https://doi.org/10.1016/j.rse.2013.04.005", says = "3D canopy structure from overlapping photos taken with an ordinary camera on a hobby drone below 130 m" },
]
instead = "Livox Mid-360 lidar (265 g, 6.5 W): it looks sideways and up, and reaches only 40 m, so it cannot map the ground from 60 m. MAPIR Survey3W ($400) adds a near-infrared band."
source = "Raspberry Pi camera specs; Livox Mid-360 specs (read 18 Nov); our ground-resolution arithmetic"
