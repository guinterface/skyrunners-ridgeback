[[part]]
id = "spot_sensor"
name = "1610 nm spot sensor (built by us): two InGaAs photodiodes behind 1610 nm filters"
system = "payload"
tier = "minimum"
qty = 1
status = "build"
price = 409.71
mass = 80
size = "50 × 40 × 45 mm printed head with a 20° view tube"
power_w = 0.1
box = { c = [125, 0, -125], dims = [50, 40, 45] }
buy = [
  { store = "SyronOptics BP1610-60 filter, 12.5 mm (×2)", link = "https://syronoptics.com/products/bp1610-60", price = "$165.00 each" },
  { store = "DigiKey Marktech MTPD1346D-100 photodiode (×2)", link = "https://www.digikey.com/en/products/detail/marktech-optoelectronics/MTPD1346D-100/5866635", price = "$17.63 each" },
  { store = "Adafruit ADS1115 16-bit converter", link = "https://www.adafruit.com/product/1085", price = "$14.95" },
  { store = "Microchip MCP6V32 op-amp (×2)", link = "https://www.microchipdirect.com/product/MCP6V32", price = "$2.25 each" },
]
job = "Measures how much 1610 nm short-wave infrared light the shrubs reflect, one reading per spot, plus the sunlight coming down."
why = "Water in leaves absorbs strongly near 1600 nm, so reflectance in this band drops as leaves hold less water; it is the standard leaf-water band. A camera for this band costs $5,650 or more (LUCID Triton SWIR) or rents for $2,250 a week, so for the first flights we build a two-channel sensor: one diode looks down through a 20° tube (a 21 m spot at 60 m), one looks up through a diffuser to read the sunlight. Parts $385 plus about $25 of small parts. It needs sunlight, so it works from the morning flight on, not before dawn. Readings taken while the drone banks in a turn are dropped, using the bank angle from the flight controller, because the upward diode then sees the sky at an angle. Each spot mixes shrub, soil and shadow, which is why the near-infrared channel below is worth adding."
without = "We would see stress (leaf pores closing) but have no reading tied to how much water the leaves hold. The band responds to water per leaf area; live fuel moisture, which fire planners use, is water per dry mass, so the two are related, not the same. Open risk: the change between dawn and midday may be too small for this band to see; the first flights test that."
refs = [
  { cite = "Hunt and Rock, Remote Sensing of Environment 30:43 (1989)", link = "https://doi.org/10.1016/0034-4257(89)90046-1", says = "changes in leaf water content detected with near- and middle-infrared reflectance" },
  { cite = "Ceccato et al., Remote Sensing of Environment 77:22 (2001)", link = "https://doi.org/10.1016/S0034-4257(01)00191-2", says = "detecting leaf water content from reflectance in the optical bands" },
  { cite = "Yebra et al., Remote Sensing of Environment 136:455 (2013)", link = "https://doi.org/10.1016/j.rse.2013.05.029", says = "review of remote sensing of live fuel moisture for fire danger" },
]
instead = "A SWIR camera through the companies we emailed (LUCID, Tech Imaging rental, SILIOS, Spectral Devices): images instead of spots, $2,250 a week to $30,000."
source = "Hunt and Rock 1989, Ceccato et al. 2001 (leaf water in the short-wave infrared); SPOT_SENSOR_CIRCUIT doc; prices BEST_PRICES 10 Nov"
connects = [["payload_computer", "I2C"]]
nodes = ["spot_sensor"]

[[part]]
id = "air_sensor"
name = "Air temperature and humidity: Sensirion SHT45"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 12.5
