  { store = "Adafruit SHT45 (STEMMA QT)", link = "https://www.adafruit.com/product/5665", price = "$12.50" },
]
job = "Measures the air temperature and humidity at the drone, every flight."
why = "Leaf temperature only means stress when compared with the air around it and how dry that air is (vapour pressure deficit). The weather meter on the ground is the main reference at canopy height; this sensor adds the air at flight height, which at dawn can differ by several degrees because of the morning temperature inversion. ±0.1 °C and ±1 % humidity; checked against the ground meter in the shade before each flight, and mounted in a small shield away from the electronics."
without = "The weather meter on the ground still gives the air near the canopy, so stress can still be read. What is lost is the air at flight height, which at dawn can be several degrees different because of the morning temperature inversion."
refs = [
  { cite = "Idso et al., Agricultural Meteorology 24:45 (1981)", link = "https://doi.org/10.1016/0002-1571(81)90032-7", says = "leaf-minus-air temperature has to be normalised for the weather, mainly how dry the air is, before it means stress" },
]
instead = "Ground weather meter only: it is the main reference anyway, but misses the air the drone flies through."
source = "Adafruit SHT45 page (read 18 Nov); Idso et al. 1981"
connects = [["payload_computer", "I2C"]]
