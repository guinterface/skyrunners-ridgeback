[[part]]
id = "payload_computer"
name = "Payload computer: Raspberry Pi 5 (4 GB) with active cooler"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 135
mass = 50
size = "85 × 56 × 20 mm with the cooler"
power_w = 7
box = { c = [110, 0, -90], dims = [85, 56, 20] }
buy = [
  { store = "Adafruit: Raspberry Pi 5, 4 GB", link = "https://www.adafruit.com/product/5812", price = "$130.00" },
  { store = "Raspberry Pi Active Cooler (any reseller)", link = "https://www.raspberrypi.com/products/active-cooler/", price = "about $5" },
]
job = "Records every sensor with the time and position from the flight controller, and triggers the camera."
why = "It runs the Raspberry Pi colour camera with its own driver, the thermal camera over USB, the spot sensor and air sensor over I2C, and reads time and position from the flight controller over a serial cable, so each reading is tagged with where the drone was. About 130 g lighter and 5 W less than the Jetson we own. Readings are tagged by time only; a 50 ms timing error is about 1 m along track at 19 m/s, so the camera trigger should also be logged by the flight controller."
without = "Readings would have no time or position, so they could not be put on the map or matched between the dawn and midday flights."
refs = []
instead = "NVIDIA Jetson Orin Nano (about $250, 176 g, 7–15 W): worth it later for processing on board, but the Raspberry Pi camera has no stock driver on it."
source = "Adafruit price (read 18 Nov); mass and power estimated until weighed"
connects = [["payload_power", "5 V, USB-C power"], ["pixhawk", "serial cable (MAVLink): time and position"], ["thermal_cam", "USB"], ["rgb_cam", "camera ribbon (CSI)"], ["spot_sensor", "I2C"], ["air_sensor", "I2C"]]
