# Ridgeback Scout: every part of the drone, in one file.
#
# HOW TO EDIT: change a value or a link here and press "Commit changes". GitHub then rebuilds
# the sheets (docs/sheets/*.xlsx) and the website automatically in about 2 minutes.
# - price = US$ each (0 = included in another part's price, or printed). mass = grams each.
# - buy = shops: store name, link, price as you want it shown.
# - Text in {curly braces} is filled from the calculations (e.g. {TW_hot}); keep the braces.
# - connects = [other part id, how it is connected].
# - nodes = names of the part in the 3D model (only change if the CAD changes).
# - size = real dimensions from the maker. box = where the part sits in the CAD [x aft, y right, z up] and its size, mm.
# - power_w = electrical power it draws in flight (sensors and payload computer only; summed into the energy budget).
# - china = 1 and duty = rate: shipped from China, import duty added to the cost. where = shop name when there is no link.
# - order = "ordered" | "arrived" | "have it" (with order_date, order_by): set from the website; missing = still to order.
# - tier (sensors only): minimum = needed for the first mission flights; add = worth adding; later = not yet.
# Design numbers that are not parts (speeds, densities, rules...) are in data/inputs.toml.

[systems]
power = { name = "Power", color = "#8a5a2b" }
lift = { name = "Lift (hover)", color = "#22221f" }
cruise = { name = "Cruise (pusher)", color = "#6b6b66" }
control = { name = "Flight control", color = "#2f5d8a" }
surfaces = { name = "Control surfaces", color = "#4e7a3a" }
airframe = { name = "Airframe", color = "#b9bcb4" }
payload = { name = "Mission sensors", color = "#1f7a72" }
ground = { name = "Ground equipment", color = "#9a6b16" }
materials = { name = "Materials, wiring and hardware", color = "#7d7466" }

[[part]]
id = "battery"
name = "Battery: 6S6P pack of Molicel P50B cells"
system = "power"
qty = 36
status = "buy (36 cells, pack built by us)"
price = 8.99
mass = 70
size = "36 Molicel P50B cells, each 21.7 mm wide × 70.4 mm tall, standing in a 6 × 6 block: 140 × 135 × 75 mm with nickel strip, BMS and wrap"
buy = [
  { store = "Liion Wholesale (36 cells, $8.99 each)", link = "https://liionwholesale.com/products/molicel-npe-inr-21700-p50b-60a-5000mah-flat-top-21700-battery-authorized-distributor", price = "$323.64" },
  { store = "IMR Batteries", link = "https://imrbatteries.com/products/molicel-21700-p50b-5000mah-60a-battery", price = "$9.99 each" },
]
job = "Powers the drone: an estimated {flights_pack} survey flights per charge. Six cells in series give 21.6 V under load; six in parallel give 30 Ah."
why = "648 Wh in 2.72 kg. In a hot-day hover each cell carries {Icell_hot} A, against a 60 A rating. It gives {tloit_sl} min of loiter with 20 % left, or {flights_pack} survey flights per charge."
instead = "Samsung 50S ($6.99 a cell, $72 cheaper): voltage sag at our current not measured, so it needs a bench test first. Samsung 50E: 9.8 A rating, too low. A LiPo pack of the same mass would hold about 40 % less energy."
source = "Sheet 04, Battery_Options and Mission_Energy"
connects = [["pm07", "XT90 connector, two 14 AWG wires per pole"]]
nodes = ["battery_6S6P_P50B"]

