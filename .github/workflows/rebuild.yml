name: Rebuild sheets and website
# Runs when someone saves (commits) a change to the data, the sheet code or the site code.
on:
  push:
    branches: [main]
    paths: ["data/parts.toml", "data/inputs.toml", "data/orders.toml", "sheets/**", "tools/**", "docs/assets/*.js", "docs/assets/*.css"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: rebuild, cancel-in-progress: false }
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install openpyxl==3.1.5 formulas==1.3.4
      - run: tools/rebuild.sh
      - name: Save the rebuilt sheets and pages
        env: { MSG: "${{ github.event.head_commit.message || 'manual run' }}" }   # passed as data, never pasted into the script
        run: |
          git config user.name "ridgeback-rebuild"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Rebuild sheets and site after: $(printf '%s' "$MSG" | head -n 1 | cut -c1-200)"
          # someone may have saved again meanwhile; their own run rebuilds from their change
          # (the build also leaves working files outside docs/ and data/: stash them so the rebase can run)
          for i in 1 2 3 4; do git push && exit 0; sleep $((i * 3)); git pull --rebase --autostash -X theirs; done; exit 1
      - name: Publish the website
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env: { GH_TOKEN: "${{ github.token }}" }
